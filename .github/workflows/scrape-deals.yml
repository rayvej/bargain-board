name: Auto-Scrape Canadian Deals Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest live Canadian & multi-retailer feeds
        run: npm run scrape:rss

      - name: Rebuild Tailwind CSS
        run: npm run build:css

      - name: Commit and push updated deals catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/deals-data.json docs/tailwind.min.css
          if git diff --staged --quiet; then
            echo "No new deals to commit."
          else
            git commit -m "Auto-ingest fresh Canadian deals & clearance data [skip ci]"
            git push
          fi
